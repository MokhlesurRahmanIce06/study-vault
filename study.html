<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 Study View - Study Vault Pro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* স্টাডি ভিউ স্পেশাল স্টাইল */
        .study-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .study-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
        }

        .study-header h1 {
            font-size: 24px;
            color: #1a1a2e;
            margin: 0;
        }

        .study-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .study-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .study-card h3 {
            color: #4a90d9;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .study-card .content {
            font-size: 16px;
            line-height: 1.7;
            color: #2c3e50;
        }

        .study-card .content pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-wrap: break-word;
            border-left: 4px solid #4a90d9;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.8;
            margin: 5px 0;
        }

        .study-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .meta-item {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 8px;
            text-align: center;
        }

        .meta-item .label {
            font-size: 11px;
            color: #6c757d;
            text-transform: uppercase;
            font-weight: 600;
        }

        .meta-item .value {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
            margin-top: 3px;
        }

        .meta-item .value .badge {
            font-size: 14px;
            padding: 4px 14px;
        }

        .study-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }

        .study-actions .btn {
            padding: 10px 24px;
            font-size: 15px;
        }

        .btn-large {
            padding: 12px 30px;
            font-size: 16px;
        }

        .progress-bar-container {
            background: #e9ecef;
            border-radius: 20px;
            height: 8px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-bar {
            height: 100%;
            border-radius: 20px;
            transition: width 0.5s ease;
        }

        .related-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .related-tag {
            background: #e9ecef;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #495057;
        }

        /* ডার্ক মোড টগল */
        .dark-mode-toggle {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .dark-mode-toggle:hover {
            background: #f0f0f0;
        }

        body.dark-mode {
            background: #1a1a2e;
        }

        body.dark-mode .study-container {
            background: #1a1a2e;
        }

        body.dark-mode .study-card {
            background: #2d2d44;
            border-color: #3d3d5c;
        }

        body.dark-mode .study-card .content {
            color: #e0e0e0;
        }

        body.dark-mode .study-card .content pre {
            background: #3d3d5c;
            border-left-color: #4a90d9;
            color: #e0e0e0;
        }

        body.dark-mode .meta-item {
            background: #3d3d5c;
        }

        body.dark-mode .meta-item .value {
            color: #e0e0e0;
        }

        body.dark-mode .study-header {
            border-bottom-color: #3d3d5c;
        }

        body.dark-mode .study-header h1 {
            color: #e0e0e0;
        }

        body.dark-mode .related-tag {
            background: #3d3d5c;
            color: #e0e0e0;
        }

        body.dark-mode .dark-mode-toggle:hover {
            background: #3d3d5c;
        }

        /* লোডিং */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .loading .spinner {
            font-size: 48px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* নোটিশ */
        .notice {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px 18px;
            border-radius: 6px;
            margin-bottom: 15px;
            color: #856404;
        }

        body.dark-mode .notice {
            background: #3d3d5c;
            border-left-color: #ffc107;
            color: #ffd60a;
        }

        /* রেস্পন্সিভ */
        @media (max-width: 768px) {
            .study-container {
                padding: 15px 10px;
            }
            .study-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .study-meta-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .study-actions .btn {
                flex: 1;
                min-width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="study-container" id="app">
        <!-- লোডিং স্টেট -->
        <div id="loadingState" class="loading">
            <div class="spinner">⏳</div>
            <p>ডেটা লোড হচ্ছে...</p>
        </div>

        <!-- কন্টেন্ট -->
        <div id="contentState" style="display:none;">
            <!-- হেডার -->
            <div class="study-header">
                <h1>📖 স্টাডি ভিউ</h1>
                <div class="study-nav">
                    <button onclick="toggleDarkMode()" class="dark-mode-toggle" title="ডার্ক মোড">🌙</button>
                    <button onclick="goBack()" class="btn btn-secondary">⬅️ লিস্টে ফিরুন</button>
                </div>
            </div>

            <!-- মেইন কন্টেন্ট -->
            <div id="studyContent">
                <!-- ডায়নামিক কন্টেন্ট এখানে লোড হবে -->
            </div>
        </div>

        <!-- না পাওয়া গেলে -->
        <div id="notFoundState" style="display:none; text-align:center; padding:60px 20px;">
            <div style="font-size:64px;">🔍</div>
            <h2 style="color:#dc3545;">টপিক খুঁজে পাওয়া যায়নি</h2>
            <p style="color:#999; margin-top:10px;">আপনি যে টপিক খুঁজছেন, তা হয়তো ডিলিট করা হয়েছে।</p>
            <button onclick="goBack()" class="btn btn-primary" style="margin-top:20px;">⬅️ লিস্টে ফিরুন</button>
        </div>
    </div>

    <script>
        // ========================================
        // ডেটা লোড
        // ========================================
        let currentTopic = null;

        function loadStudyData() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            if (!id) {
                showNotFound();
                return;
            }

            // লোকাল স্টোরেজ থেকে ডেটা নেওয়া
            const saved = localStorage.getItem('studyVaultData');
            if (!saved) {
                showNotFound();
                return;
            }

            try {
                const data = JSON.parse(saved);
                const topics = data.topics || [];
                currentTopic = topics.find(t => t.id === parseInt(id));
                
                if (!currentTopic) {
                    showNotFound();
                    return;
                }

                renderStudyView(currentTopic);
                
            } catch (error) {
                console.error('ডেটা লোড ত্রুটি:', error);
                showNotFound();
            }
        }

        // ========================================
        // রেন্ডার স্টাডি ভিউ
        // ========================================
        function renderStudyView(topic) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('contentState').style.display = 'block';
            document.getElementById('notFoundState').style.display = 'none';

            const container = document.getElementById('studyContent');
            
            const statusColors = {
                'New': '#856404',
                'Learning': '#004085',
                'Practicing': '#8a4b00',
                'Comfortable': '#155724',
                'Interview Ready': '#0c5460',
                'Needs Revision': '#721c24'
            };

            const statusBg = {
                'New': '#fff3cd',
                'Learning': '#cce5ff',
                'Practicing': '#ffe5d0',
                'Comfortable': '#d4edda',
                'Interview Ready': '#d1ecf1',
                'Needs Revision': '#f8d7da'
            };

            const diffColors = {
                'Easy': '#28a745',
                'Medium': '#ffc107',
                'Hard': '#dc3545'
            };

            const captureColor = topic.captured >= 80 ? '#28a745' : topic.captured >= 50 ? '#ffc107' : '#dc3545';

            container.innerHTML = `
                <!-- টপিক ইনফো -->
                <div class="study-card">
                    <h3>📂 Main Topic</h3>
                    <div class="content"><strong>${escapeHtml(topic.mainTopic)}</strong></div>
                </div>

                <div class="study-card">
                    <h3>📖 Sub Topic</h3>
                    <div class="content">${escapeHtml(topic.subTopic)}</div>
                </div>

                <div class="study-card">
                    <h3>❓ Question</h3>
                    <div class="content" style="font-size:18px; font-weight:500;">${escapeHtml(topic.question)}</div>
                </div>

                <div class="study-card">
                    <h3>✅ Answer</h3>
                    <div class="content">
                        <pre>${escapeHtml(topic.answer || '— উত্তর নেই —')}</pre>
                    </div>
                </div>

                <!-- মেটা ডেটা -->
                <div class="study-card">
                    <h3>📊 Knowledge Status</h3>
                    <div class="study-meta-grid">
                        <div class="meta-item">
                            <div class="label">Status</div>
                            <div class="value">
                                <span class="badge" style="background:${statusColors[topic.knowledgeStatus] || '#6c757d'}; color:white; padding:4px 16px; border-radius:20px;">
                                    ${topic.knowledgeStatus || 'New'}
                                </span>
                            </div>
                        </div>
                        <div class="meta-item">
                            <div class="label">Difficulty</div>
                            <div class="value" style="color:${diffColors[topic.difficulty] || '#6c757d'};">
                                ${topic.difficulty || 'Medium'}
                            </div>
                        </div>
                        <div class="meta-item">
                            <div class="label">Study Type</div>
                            <div class="value">${topic.studyType || 'Learn'}</div>
                        </div>
                        <div class="meta-item">
                            <div class="label">Version</div>
                            <div class="value">v${topic.version || 1}</div>
                        </div>
                    </div>
                </div>

                <!-- প্রগ্রেস -->
                <div class="study-card">
                    <h3>📈 Progress</h3>
                    <div class="study-meta-grid">
                        <div class="meta-item">
                            <div class="label">Captured</div>
                            <div class="value" style="color:${captureColor};">
                                ${topic.captured || 0}%
                                <div class="progress-bar-container">
                                    <div class="progress-bar" style="width:${topic.captured || 0}%; background:${captureColor};"></div>
                                </div>
                            </div>
                        </div>
                        <div class="meta-item">
                            <div class="label">Confidence</div>
                            <div class="value" style="color:${topic.confidence >= 80 ? '#28a745' : topic.confidence >= 50 ? '#ffc107' : '#dc3545'};">
                                ${topic.confidence || 0}%
                                <div class="progress-bar-container">
                                    <div class="progress-bar" style="width:${topic.confidence || 0}%; background:${topic.confidence >= 80 ? '#28a745' : topic.confidence >= 50 ? '#ffc107' : '#dc3545'};"></div>
                                </div>
                            </div>
                        </div>
                        <div class="meta-item">
                            <div class="label">Study Count</div>
                            <div class="value">
                                ${topic.studyCount || 0}
                                <button onclick="incrementStudyFromView(${topic.id})" class="btn btn-warning" style="padding:2px 14px; font-size:14px; margin-left:8px;">
                                    +1
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- রেফারেন্স ও সোর্স -->
                <div class="study-card">
                    <h3>🔗 References</h3>
                    <div class="study-meta-grid">
                        <div class="meta-item">
                            <div class="label">Source</div>
                            <div class="value" style="font-size:14px;">${escapeHtml(topic.source || 'N/A')}</div>
                        </div>
                        <div class="meta-item">
                            <div class="label">Viva/Job Ref</div>
                            <div class="value" style="font-size:14px;">${escapeHtml(topic.vivaRef || 'N/A')}</div>
                        </div>
                    </div>
                </div>

                <!-- রিলেটেড টপিকস -->
                ${topic.relatedTopics ? `
                <div class="study-card">
                    <h3>🔗 Related Topics</h3>
                    <div class="related-topics">
                        ${topic.relatedTopics.split(',').map(t => `<span class="related-tag">${t.trim()}</span>`).join('')}
                    </div>
                </div>
                ` : ''}

                <!-- রিমার্কস -->
                ${topic.remarks ? `
                <div class="study-card">
                    <h3>💬 Remarks</h3>
                    <div class="content">${escapeHtml(topic.remarks)}</div>
                </div>
                ` : ''}

                <!-- ডেট টাইম -->
                <div class="study-card">
                    <h3>📅 Timeline</h3>
                    <div class="study-meta-grid">
                        <div class="meta-item">
                            <div class="label">Created</div>
                            <div class="value" style="font-size:14px;">${topic.dateCreated || 'N/A'}</div>
                        </div>
                        <div class="meta-item">
                            <div class="label">Last Studied</div>
                            <div class="value" style="font-size:14px;">${topic.lastStudied || 'N/A'}</div>
                        </div>
                        <div class="meta-item">
                            <div class="label">Last Updated</div>
                            <div class="value" style="font-size:14px;">${topic.lastUpdated || 'N/A'}</div>
                        </div>
                    </div>
                </div>

                <!-- অ্যাকশন বাটন -->
                <div class="study-actions">
                    <button onclick="incrementStudyFromView(${topic.id})" class="btn btn-warning btn-large">
                        📖 স্টাডি করুন (+1)
                    </button>
                    <button onclick="openEditFromView(${topic.id})" class="btn btn-primary">
                        ✏️ এডিট করুন
                    </button>
                    <button onclick="deleteFromView(${topic.id})" class="btn btn-danger">
                        🗑️ ডিলিট করুন
                    </button>
                    <button onclick="goBack()" class="btn btn-secondary">
                        ⬅️ লিস্টে ফিরুন
                    </button>
                </div>

                <div class="notice" style="margin-top:15px;">
                    💡 <strong>টিপ:</strong> স্টাডি করুন বাটনে ক্লিক করলে কাউন্ট +১ হবে এবং অটো সিঙ্ক হবে।
                </div>
            `;
        }

        // ========================================
        // ফাংশনসমূহ
        // ========================================
        function escapeHtml(text) {
            if (!text) return '—';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        function showNotFound() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('contentState').style.display = 'none';
            document.getElementById('notFoundState').style.display = 'block';
        }

        // ========================================
        // ডার্ক মোড টগল
        // ========================================
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const btn = document.querySelector('.dark-mode-toggle');
            if (document.body.classList.contains('dark-mode')) {
                btn.textContent = '☀️';
                localStorage.setItem('studyDarkMode', 'true');
            } else {
                btn.textContent = '🌙';
                localStorage.setItem('studyDarkMode', 'false');
            }
        }

        // ========================================
        // CRUD অপারেশন (স্টাডি ভিউ থেকে)
        // ========================================
        function incrementStudyFromView(id) {
            // লোকাল স্টোরেজ থেকে ডেটা নিন
            const saved = localStorage.getItem('studyVaultData');
            if (!saved) return;
            
            try {
                const data = JSON.parse(saved);
                const topics = data.topics || [];
                const topic = topics.find(t => t.id === id);
                
                if (topic) {
                    topic.studyCount = (topic.studyCount || 0) + 1;
                    topic.lastStudied = new Date().toISOString().replace('T', ' ').substring(0, 16);
                    
                    // আপডেট করা ডেটা সেভ করুন
                    localStorage.setItem('studyVaultData', JSON.stringify(data));
                    
                    // পেজ রিলোড না করে রেন্ডার আপডেট করুন
                    currentTopic = topic;
                    renderStudyView(topic);
                    
                    // অটো সিঙ্কের জন্য main page-এ পাঠান
                    showToast('✅ স্টাডি কাউন্ট +১ হয়েছে!');
                }
            } catch (error) {
                console.error('ইনক্রিমেন্ট ত্রুটি:', error);
            }
        }

        function openEditFromView(id) {
            // মেইন পেজে এডিট মোডে পাঠান
            window.location.href = `index.html?edit=${id}`;
        }

        function deleteFromView(id) {
            if (!confirm('⚠️ কি আপনি এই টপিক ডিলিট করতে চান?')) return;
            
            const saved = localStorage.getItem('studyVaultData');
            if (!saved) return;
            
            try {
                const data = JSON.parse(saved);
                data.topics = data.topics.filter(t => t.id !== id);
                localStorage.setItem('studyVaultData', JSON.stringify(data));
                
                showToast('🗑️ টপিক ডিলিট হয়েছে!');
                setTimeout(() => {
                    goBack();
                }, 1000);
            } catch (error) {
                console.error('ডিলিট ত্রুটি:', error);
            }
        }

        // ========================================
        // টোস্ট নোটিফিকেশন
        // ========================================
        function showToast(message) {
            const oldToast = document.querySelector('.toast-notification');
            if (oldToast) oldToast.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                bottom: 30px;
                right: 30px;
                background: #28a745;
                color: white;
                padding: 15px 25px;
                border-radius: 8px;
                font-size: 16px;
                font-weight: 600;
                box-shadow: 0 4px 20px rgba(0,0,0,0.2);
                z-index: 99999;
                animation: slideUp 0.3s ease;
                max-width: 350px;
            `;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // অ্যানিমেশন
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideUp {
                from { transform: translateY(30px); opacity: 0; }
                to { transform: translateY(0); opacity: 1; }
            }
        `;
        document.head.appendChild(style);

        // ========================================
        // ডার্ক মোড লোড
        // ========================================
        function loadDarkModePreference() {
            const darkMode = localStorage.getItem('studyDarkMode') === 'true';
            if (darkMode) {
                document.body.classList.add('dark-mode');
                const btn = document.querySelector('.dark-mode-toggle');
                if (btn) btn.textContent = '☀️';
            }
        }

        // ========================================
        // পেজ লোড
        // ========================================
        window.onload = function() {
            loadDarkModePreference();
            loadStudyData();
        };
    </script>
</body>
</html>
